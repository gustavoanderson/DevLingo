# Publica site/ no GitHub Pages.
#
# Existe um fluxo proprio porque o Pages so serve a raiz do repositorio ou
# /docs, e o site mora em site/. Copiar para /docs criaria duas copias da
# mesma pagina, e uma delas ficaria para tras -- a mesma armadilha que o
# CLAUDE.md registra para arquivos gerados.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que estiver no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: publicacao
        uses: actions/deploy-pages@v4

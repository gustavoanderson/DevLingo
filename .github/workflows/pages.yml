# Publica no GitHub Pages o site do portfolio E o jogo no navegador.
#
# Existe um fluxo proprio porque o Pages so serve a raiz do repositorio ou
# /docs, e nem o site nem o jogo moram ali. Copiar para /docs criaria duas
# copias da mesma pagina, e uma delas ficaria para tras -- a mesma armadilha
# que o CLAUDE.md registra para arquivos gerados.
#
# ELE COMPILA O DART, e isso nao e opcional: `jogo/cerebro.js` e
# `jogo/conteudo.json` NAO sao versionados. O cerebro porque `dart compile js`
# nao garante saida byte a byte entre versoes do SDK, e versiona-lo criaria um
# portao que reprovaria por troca de versao do Flutter sem ninguem ter mexido
# em codigo. Sem este passo o jogo publicado abriria numa tela morta.
name: Pages

# SO PUBLICA DEPOIS DO CI VERDE, desde 25/09/2026. Antes os dois fluxos
# disparavam juntos a cada push, e um site com teste vermelho ia ao ar do
# mesmo jeito -- a publicacao nao sabia do CI. Agora ela espera o CI
# TERMINAR e so segue se ele passou.
#
# `workflow_run` nao aceita filtro de caminho, entao toda mudanca na `main`
# republica o site. Custa um minuto de runner, gratuito em repositorio
# publico, e elimina a pergunta "esta mudanca devia ter publicado?".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; nao cancela a que estiver no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # CI de PR tambem dispara `workflow_run`; so o push na `main` publica, e so
    # se passou. A publicacao manual continua valendo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      # O commit que o CI APROVOU, e nao o ultimo da `main`: se outro push
      # chegou no meio, publicar o mais novo seria publicar algo nao testado.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A VERSAO E FIXA, e igual a do ci.yml de proposito: o cerebro que vai ao
      # ar tem de sair do mesmo compilador que a suite testa. Deixar uma delas
      # flutuar esvazia a comparacao -- e o mesmo argumento que ja prende a
      # versao no job que confere o contrato de normalizacao.
      - name: Preparar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Gerar o cerebro e o indice das licoes
        run: |
          cd app && flutter pub get && cd ..
          python tools/construir_jogo.py

      # O LAYOUT PUBLICADO COPIA O DO REPOSITORIO, e isso e o que faz o jogo
      # funcionar sem tocar num caminho: ele le `../app/assets/content/`,
      # `../assets/mascot/` e `../site/falas/`, exatamente como quando roda em
      # 127.0.0.1 servindo a raiz. Um layout so, dev e producao.
      #
      # O site continua na RAIZ, e nao em /site/, porque a URL dele ja esta
      # divulgada -- mover exigiria um redirecionamento, e portfolio que abre
      # redirecionando e pior que uma copia.
      - name: Montar a pasta de publicacao
        run: |
          mkdir -p publicacao/jogo publicacao/assets publicacao/app/assets publicacao/site
          cp -r site/. publicacao/
          cp -r jogo/. publicacao/jogo/
          cp -r assets/mascot publicacao/assets/
          cp -r app/assets/content publicacao/app/assets/
          # As falas e o codec aparecem duas vezes, e isso e deliberado: o site
          # na raiz alcanca `falas/`, o jogo alcanca `../site/falas/`. As duas
          # copias saem do MESMO checkout nesta MESMA execucao, entao nao ha
          # como divergirem -- o que o CLAUDE.md proibe e a copia que fica para
          # tras, e esta e remontada a cada publicacao.
          cp -r site/falas publicacao/site/
          cp site/codec.js publicacao/site/
          echo "--- o que vai ao ar ---"
          du -sh publicacao
          ls publicacao publicacao/jogo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicacao
      - id: publicacao
        uses: actions/deploy-pages@v4

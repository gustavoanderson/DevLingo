name: Validar banco de questoes

# Portao de qualidade: nenhuma questao mal formada entra na branch principal.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conteudo:
    name: Conteudo e contrato em Python
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install jsonschema

      - name: Rodar o validador
        run: python3 tools/validate_questions.py app/assets/content/

      - name: Provar o contrato de normalizacao (lado Python)
        run: python3 tools/test_normalize.py

  app:
    name: App em Dart
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      # A versao e fixa de proposito. O contrato de normalizacao compara duas
      # implementacoes; deixar uma delas flutuar sozinha esvazia a comparacao.
      - name: Preparar o Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Baixar as dependencias
        working-directory: app
        run: flutter pub get

      - name: Analise estatica
        working-directory: app
        run: flutter analyze

      # Roda o mesmo tools/normalize_cases.json que o job de Python roda.
      # Se as duas implementacoes divergirem, um dos dois jobs reprova.
      - name: Testes
        working-directory: app
        run: flutter test

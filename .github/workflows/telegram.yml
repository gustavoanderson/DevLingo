# A ponte do Telegram.
#
# Le as mensagens que o Gustavo manda ao bot, responde os comandos com dados
# medidos na hora, e guarda o resto como recado no RECADOS.md.
#
# ## DESLIGADO desde 26/09/2026: o bot roda na VM da Oracle
#
# Medido em 24/09: o cron pedia "a cada minuto" e o GitHub executava a cada
# ~4 h (mediana de 40 execucoes; de 1h48 a 6h55). Hoje o MESMO script roda na
# VM como servico do systemd (telegram-bot), a cada 5 s, e o primeiro recado
# chegou ao GitHub 4 s depois de enviado. Ver ~/bot/rodar.sh na VM.
#
# O agendamento saiu -- dois lugares lendo o mesmo bot disputariam as mesmas
# mensagens. Ficou o `workflow_dispatch`: se a VM cair, roda-se isto a mao.
#
# ## Sobre o "a cada minuto" (historico)
#
# O cron abaixo pede execucao a cada minuto, e o GitHub **nao garante isso**.
# A documentacao dele avisa que tarefas agendadas atrasam em horario de pico,
# e cron de um minuto costuma virar cinco ou dez na pratica.
#
# Esta escrito assim de proposito, para MEDIR o atraso real em vez de teorizar
# sobre ele. Se incomodar, o mesmo script roda num aparelho proprio -- o
# Gustavo tem um tablet parado -- e ai e instantaneo de verdade.
#
# Custo zero: Actions e gratuito em repositorio publico.
#
# ## Por que ele pode commitar
#
# Recado novo precisa ficar no repositorio para o Claude ler depois. O commit
# so acontece quando ha recado -- rodadas vazias, que sao a maioria, nao
# sujam o historico.

name: Telegram

on:
  workflow_dispatch:

# Duas rodadas ao mesmo tempo brigariam pelo mesmo `getUpdates` e pelo mesmo
# commit. A segunda espera a primeira terminar.
concurrency:
  group: telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ponte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # O /status conta commits dos ultimos 7 dias; com checkout raso ele
          # enxergaria um so.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # O /status roda o validador de verdade para dizer se o banco esta
      # aprovado, e ele precisa disto.
      - name: Instalar dependencias
        run: pip install jsonschema

      - name: Ler e responder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/telegram.py

      - name: Guardar recado novo, se houver
        run: |
          if [ -n "$(git status --porcelain RECADOS.md)" ]; then
            git config user.name "DevLingo bot"
            git config user.email "noreply@github.com"
            git add RECADOS.md
            git commit -m "Recado novo pelo Telegram"
            # Outra rodada pode ter commitado enquanto esta rodava.
            git pull --rebase --autostash origin main
            git push
          else
            echo "nenhum recado novo"
          fi

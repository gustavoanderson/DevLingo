name = "tronikat"
main = "src/index.js"
compatibility_date = "2026-09-01"

# O Workers AI entra como "binding": o Worker chama env.AI.run(...) e a conta
# nunca expoe chave nenhuma no codigo.
[ai]
binding = "AI"

# Medido: com prefixo 44/52, sem 31/52 (ver src/index.js). Nao troque sem remedir.
[vars]
FORMATO = "gemma"

# LIMITE DE USO DO /perguntar: um Durable Object por IP, e o porque esta em
# src/index.js, junto da classe. Durable Object com SQLite e o unico tipo que o
# plano gratuito oferece -- por isso `new_sqlite_classes`, mesmo sem gravar nada.
[[durable_objects.bindings]]
name = "LIMITE"
class_name = "LimiteDePerguntas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiteDePerguntas"]

# AQUECE A VOZ DE 15 EM 15 MINUTOS.
#
# Confirmado na documentacao oficial antes de escrever: Cron Triggers existem
# no plano gratuito, com teto de 5 por conta (250 no pago). Esta e a primeira.
#
# O intervalo sai da medicao de 21/09/2026: 15 minutos e o maior tempo de
# ociosidade em que eu PROVEI que a voz nao esfria (0,72-0,76x o tempo real em
# cinco chamadas). Numero maior seria chute; para subi-lo, meca antes.
#
# Sao ~96 chamadas por dia, de uma frase de tres letras. Quem carrega o peso de
# verdade e o aquecimento na visita, no site -- este aqui e seguro, e de quebra
# da sinal de vida para a Oracle, que recicla instancia Always Free ociosa.
[triggers]
# DOIS RITMOS, porque duas coisas esfriam em escalas diferentes:
#
#   */3   a BUSCA (embedding do Workers AI), que esfria em MINUTOS -- medido,
#         300 s de pausa levaram a busca de ~250 ms para 4388 ms
#   */15  a VOZ no Oracle, que so esfria depois de horas
#
# Sao 2 dos 5 gatilhos do plano gratuito.
crons = ["*/3 * * * *", "*/15 * * * *"]

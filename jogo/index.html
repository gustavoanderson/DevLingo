<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevLingo</title>
<meta name="description" content="O DevLingo no navegador, com o mesmo cérebro do app Android.">
<!-- Favicon embutido: um arquivo a parte custaria uma requisicao, e a
     ausencia dele custa um 404 no console -- que polui a medicao e faz
     parecer que a pagina tem defeito. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23170A31'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' text-anchor='middle' fill='%2339FF14'%3E&gt;_%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!--
  O DEVLINGO NO NAVEGADOR.

  Nada nesta pagina decide regra de jogo: se uma resposta esta certa, quando
  eliminar, quando revelar, como colorir o codigo, em que ordem as trilhas
  aparecem, que licao nao se joga. Tudo isso vem de `cerebro.js`, compilado de
  `app/lib/ponte_web.dart`, que usa os MESMOS arquivos que o app Android usa e
  que os testes do app cobrem.

  Tres vistas numa pagina so, trocadas pelo `#` do endereco -- assim o botao
  voltar do navegador funciona, e um link aponta direto para uma licao.
-->

<!-- ==================================================== escolha de trilha -->
<section class="vista" id="vista-escolha" hidden>
  <div class="coluna">
    <header class="marca">
      <h1 class="logo" aria-label="DevLingo"><span>Dev</span>Lingo</h1>
      <p class="lema">Aprenda a programar uma questão por vez.</p>
    </header>
    <h2 class="rotulo-secao">Escolha uma trilha</h2>
    <nav class="cartoes" id="lista-trilhas" aria-label="Trilhas"></nav>
  </div>
</section>

<!-- ============================================================= a trilha -->
<section class="vista" id="vista-trilha" hidden>
  <div class="coluna">
    <header class="cabecalho">
      <a class="voltar" href="#/" aria-label="Voltar para as trilhas">←</a>
      <h1 class="nome-trilha" id="nome-trilha"></h1>
    </header>
    <p class="descricao-trilha" id="descricao-trilha"></p>
    <nav class="cartoes" id="lista-licoes" aria-label="Lições"></nav>
  </div>
</section>

<!-- ============================================================ exercicio -->
<div class="tela vista" id="vista-exercicio" hidden>

  <header class="topo">
    <a class="sair" id="sair" href="#/" title="Sair da lição" aria-label="Sair da lição">✕</a>
    <div class="barra" role="progressbar" aria-label="Progresso da lição"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="barra"></i></div>
    <span class="contador" id="contador">—</span>
  </header>

  <main class="miolo" id="miolo">
    <span class="topico" id="topico">carregando</span>
    <p class="enunciado" id="enunciado">Abrindo a questão…</p>

    <div class="ide" id="ide" hidden>
      <div class="ide-aba">
        <span class="bolinhas" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ide-nome" id="ide-nome">exemplo</span>
        <button class="copiar" id="copiar">copiar</button>
      </div>
      <pre class="codigo" id="codigo" tabindex="0" aria-label="Bloco de código do exercício"></pre>
    </div>

    <p class="molde" id="molde" hidden></p>
    <div class="alternativas" id="alternativas" role="group" aria-label="Alternativas"></div>
    <input class="campo" id="campo" hidden autocomplete="off" spellcheck="false"
           aria-label="Sua resposta">
  </main>

  <footer class="rodape">
    <div class="retorno" id="retorno" hidden>
      <div class="titulo" id="retorno-titulo"></div>
      <div class="corpo" id="retorno-corpo"></div>
    </div>
    <div class="acoes">
      <button class="btn dica" id="btn-dica">Dica</button>
      <button class="btn principal" id="btn-verificar">Verificar</button>
    </div>
  </footer>

</div>

<p class="falha" id="falha" hidden></p>

<script src="cerebro.js"></script>
<script src="jogo.js"></script>
</body>
</html>

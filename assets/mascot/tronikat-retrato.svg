<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520" role="img">
<title>Tr∅nikAt — retrato</title>
<desc>Close no rosto e ombros do Tr∅nikAt: metade esquerda de pelo branco com olho preto redondo e brilho branco, metade direita de aco escovado com scouter verde aceso. Moletom roxo de capuz, com remendo de terminal no peito.</desc>

<defs>
  <!-- Volume do pelo: claro em cima, sombra embaixo. -->
  <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="62%" stop-color="#F2F0FF"/>
    <stop offset="100%" stop-color="#D6D2EA"/>
  </linearGradient>

  <!-- Nao ha gradiente de metal aqui, e isso foi aprendido no aparelho.

       O aco era um `linearGradient` e a metade metalica da cabeca saia branca,
       com o pelo de baixo aparecendo. Duas tentativas nao resolveram: escurecer
       os stops e trocar para `gradientUnits="userSpaceOnUse"`. O que resolveu a
       duvida foi uma sonda : o MESMO caminho pintado de #FF0000 chapado
       apareceu inteiro e perfeito. Ou seja: o caminho estava certo o tempo todo
       e o preenchimento com gradiente e que nao era aplicado NAQUELE elemento.

       A causa raiz nao foi isolada, e nao vou fingir que foi. O mesmo gradiente
       funciona no `<polygon>` da orelha, e `moletom` e `capuz` funcionam em
       `<path>` com curvas : entao "gradiente em path nao funciona" seria uma
       regra larga demais para a evidencia que eu tenho.

       Por isso o volume do aco e feito com tons chapados, um sobre o outro:
       chapado desenhou em todos os testes. Arte que so aparece se o renderizador
       colaborar nao e arte, e aposta. Os tres tons ficam anotados aqui para a
       cabeca e a orelha nao divergirem:
         aco claro  #6E7597   aco medio #545B7A   aco escuro #3E4460 -->

  <!-- Vidro do scouter. LINEAR, e nao radial: o `radialGradient` da primeira
       versao nao foi aplicado e o visor renderizou preto no aparelho. -->
  <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2FA81C"/>
    <stop offset="55%" stop-color="#166F0E"/>
    <stop offset="100%" stop-color="#0B3D07"/>
  </linearGradient>

  <linearGradient id="moletom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3A2568"/>
    <stop offset="100%" stop-color="#1E1240"/>
  </linearGradient>

  <linearGradient id="capuz" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#160C2E"/>
    <stop offset="100%" stop-color="#2B1B52"/>
  </linearGradient>
</defs>

<!-- ============================ ORELHAS ============================ -->
<!-- Ficam atras da cabeca, entao vem primeiro. A direita e o espelho exato da
     esquerda: na versao anterior ela tinha outro angulo e lia como estilhaco
     solto, e nao como orelha. -->
<polygon points="92,22 124,132 192,92" fill="url(#pelo)"/>
<polygon points="106,48 134,122 178,96" fill="#FF7AD9"/>
<polygon points="106,48 134,122 178,96" fill="#FF2D95" opacity="0.35"/>

<polygon points="308,22 276,132 208,92" fill="#6E7597"/>
<polygon points="294,48 266,122 222,96" fill="#3E4460"/>
<line x1="300" y1="40" x2="272" y2="128" stroke="#B9BFD8" stroke-width="2.5" opacity="0.7"/>

<!-- ============================ CABECA ============================ -->
<ellipse cx="200" cy="205" rx="128" ry="118" fill="url(#pelo)"/>

<!-- A metade metalica, em tres tons chapados, um sobre o outro.
     A de baixo sobra apenas na borda e vira o bisel escuro; a de cima e a face
     iluminada. O motivo de nao ser um gradiente esta nos `defs`.
     Os pontos de controle estao a 0,5523 do raio, que e a aproximacao classica
     de um quarto de elipse por Bezier cubica. -->
<path d="M200 87
         C 270.7 87 328 139.8 328 205
         C 328 270.2 270.7 323 200 323 Z" fill="#3E4460"/>
<path d="M200 95
         C 266.3 95 320 144.7 320 205
         C 320 265.3 266.3 315 200 315 Z" fill="#545B7A"/>
<path d="M200 103
         C 261.3 103 310 149.6 310 205
         C 310 249 285 285 246 303 L200 303 Z" fill="#6E7597"/>

<!-- Reflexo especular: e o que faz aco parecer aco, e nao cinza chapado. -->
<path d="M232 122 Q282 152 292 212" stroke="#E4E8F7" stroke-width="9"
      stroke-linecap="round" fill="none" opacity="0.40"/>
<path d="M244 258 Q280 248 294 224" stroke="#E4E8F7" stroke-width="4"
      stroke-linecap="round" fill="none" opacity="0.22"/>

<!-- Placas, rebites e uma grelha de ventilacao no maxilar -->
<path d="M258 118 Q306 205 264 296" stroke="#333850" stroke-width="2.5" fill="none"/>
<circle cx="276" cy="146" r="4.5" fill="#333850"/>
<circle cx="292" cy="205" r="4.5" fill="#333850"/>
<g stroke="#333850" stroke-width="3" stroke-linecap="round">
  <line x1="246" y1="284" x2="278" y2="272"/>
  <line x1="250" y1="296" x2="278" y2="285"/>
  <line x1="256" y1="307" x2="276" y2="298"/>
</g>

<!-- Tufos de pelo na silhueta do lado vivo -->
<path d="M76 190 L95 184 L78 175 Z" fill="url(#pelo)"/>
<path d="M74 228 L93 226 L75 215 Z" fill="url(#pelo)"/>
<path d="M82 266 L99 259 L86 250 Z" fill="url(#pelo)"/>

<!-- Luz no alto da cabeca, do lado do pelo -->
<path d="M114 148 Q158 110 196 104" stroke="#FFFFFF" stroke-width="8"
      stroke-linecap="round" fill="none" opacity="0.6"/>

<!-- Costura ciano: a divisa entre o gato e a maquina -->
<line x1="200" y1="87" x2="200" y2="323" stroke="#00E5FF" stroke-width="4"/>
<line x1="200" y1="87" x2="200" y2="323" stroke="#B6F7FF" stroke-width="1.4" opacity="0.9"/>
<circle cx="200" cy="130" r="4" fill="#00E5FF"/>
<circle cx="200" cy="286" r="4" fill="#00E5FF"/>

<!-- ============================ OLHO VIVO ============================ -->
<!-- Olho PRETO com um brilho branco, copiado de `tronikat.svg`.
     A primeira versao deste retrato tinha olho ambar com pupila em fenda. Era
     invencao minha, e nao existe no personagem: em `tronikat.svg` o olho e um
     `<ellipse>` #17092E inteiro com um `<circle>` branco em cima. Cor de olho
     nao e detalhe de close, e identidade : um gato de olho ambar e outro gato.

     As proporcoes vem da arte canonica, e nao de gosto:
       olho rx  = 10/52  do raio da cabeca  ->  0,192 x 128 = 24,6
       olho ry  = 11,5/46 do raio da cabeca ->  0,250 x 118 = 29,5
       centro   = 48% do raio a esquerda do centro da cabeca
       brilho r = 35% do rx do olho, deslocado para cima e para a esquerda -->
<ellipse cx="139" cy="198" rx="25" ry="30" fill="#17092E"/>
<circle cx="129" cy="185" r="8.8" fill="#FFFFFF"/>
<!-- Sobrancelha discreta: o unico acrescimo do close, e so da expressao.
     Nao mexe na identidade, que e o olho. -->
<path d="M110 154 Q142 143 174 155" stroke="#CFCAE6" stroke-width="5"
      stroke-linecap="round" fill="none" opacity="0.75"/>

<!-- ============================ BIGODES ============================ -->
<g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95">
  <path d="M110 228 Q62 216 24 202"/>
  <path d="M108 244 Q58 242 18 240"/>
  <path d="M110 260 Q62 270 26 284"/>
</g>
<!-- Claros o bastante para existirem sobre o fundo escuro. Na versao anterior
     eram #9BA0B8 e sumiam na noite atras do personagem. -->
<g stroke="#C9CFE6" stroke-width="3" stroke-linecap="round" opacity="0.9">
  <path d="M290 228 Q338 216 376 202"/>
  <path d="M292 244 Q342 242 382 240"/>
  <path d="M290 260 Q338 270 374 284"/>
</g>
<g stroke="#8B92AE" stroke-width="2">
  <line x1="334" y1="210" x2="342" y2="222"/><line x1="342" y1="210" x2="334" y2="222"/>
  <line x1="346" y1="262" x2="354" y2="274"/><line x1="354" y1="262" x2="346" y2="274"/>
</g>

<!-- ============================ FOCINHO ============================ -->
<polygon points="182,240 218,240 200,260" fill="#FF4FD8"/>
<polygon points="188,243 212,243 200,253" fill="#FF9AE4"/>
<line x1="200" y1="260" x2="200" y2="271" stroke="#17092E" stroke-width="3" stroke-linecap="round"/>
<path d="M200 271 Q183 288 166 273" stroke="#17092E" stroke-width="3.5"
      fill="none" stroke-linecap="round"/>
<path d="M200 271 Q217 288 234 273" stroke="#20243A" stroke-width="3.5"
      fill="none" stroke-linecap="round"/>

<!-- ============================ SCOUTER ============================ -->
<!-- Menor e mais alto que na primeira versao, onde cobria metade do rosto e
     lia como venda de realidade virtual. Um scouter cobre UM olho. -->
<g transform="rotate(-8 262 188)">
  <!-- Haste passando sobre a orelha -->
  <rect x="330" y="168" width="48" height="34" rx="14" fill="#3A3E52"/>
  <circle cx="356" cy="185" r="8" fill="#8B92AE"/>
  <circle cx="356" cy="185" r="3.5" fill="#4A5069"/>

  <!-- Halo do visor: duas bordas verdes desbotando, no lugar de um filtro de
       desfoque, que nem todo renderizador de SVG aplica. -->
  <rect x="204" y="152" width="140" height="72" rx="18" fill="#39FF14" opacity="0.12"/>
  <rect x="209" y="157" width="130" height="62" rx="15" fill="#39FF14" opacity="0.18"/>

  <rect x="212" y="160" width="124" height="56" rx="13" fill="#4A5069"/>
  <rect x="220" y="167" width="108" height="42" rx="8" fill="#0A1F06"/>
  <rect x="224" y="171" width="100" height="34" rx="5" fill="url(#vidro)"/>

  <!-- Varredura: linhas finas que dao textura de tela acesa -->
  <g stroke="#7CFF4D" stroke-width="1.3" opacity="0.30">
    <line x1="224" y1="177" x2="324" y2="177"/>
    <line x1="224" y1="185" x2="324" y2="185"/>
    <line x1="224" y1="193" x2="324" y2="193"/>
    <line x1="224" y1="201" x2="324" y2="201"/>
  </g>

  <text x="232" y="196" font-family="ui-monospace, monospace" font-size="21"
        font-weight="700" fill="#FFE14D">h0Oman</text>

  <!-- Reflexo no vidro -->
  <path d="M228 203 L252 173 L268 173 L240 205 Z" fill="#FFFFFF" opacity="0.14"/>

  <!-- Aro -->
  <rect x="212" y="160" width="124" height="56" rx="13" fill="none"
        stroke="#39FF14" stroke-width="2.5" opacity="0.75"/>
  <rect x="212" y="160" width="124" height="56" rx="13" fill="none"
        stroke="#5C6382" stroke-width="6" opacity="0.55"/>
</g>

<!-- ============================ PESCOCO ============================ -->
<!-- Curto e largo. Na versao anterior ele tinha 84 de largura e 78 de altura, e
     era metade do problema de proporcao: pescoco fino e comprido AFASTA a
     cabeca do corpo, e o olho le isso como cabeca grande demais. Este gato,
     em `tronikat.svg`, praticamente nao tem pescoco. -->
<!-- Estreito em cima, ALARGANDO para baixo. A versao anterior fazia o contrario
     e o pescoco lia como um balde: pescoco que afina na base nao encontra ombro
     nenhum, ele termina no ar. -->
<path d="M158 296 Q152 340 142 396 L200 396 L200 296 Z" fill="#D6D2EA"/>
<path d="M200 296 L200 396 L258 396 Q248 340 242 296 Z" fill="#5C6382"/>
<!-- Sombra do queixo sobre o pescoco -->
<path d="M158 296 Q200 328 242 296 Q200 316 158 296 Z" fill="#17092E" opacity="0.32"/>

<!-- ============================ OMBROS ============================ -->
<!-- Os ombros SANGRAM pelas bordas, de proposito, e e isto que conserta a
     proporcao. Antes iam de x=22 a x=378 num viewBox de 0 a 400: sobrava
     margem dos dois lados, o corpo virava uma figura fechada e completa dentro
     do quadro, e o conjunto lia como bonequinho de cabeca grande.

     Um close nao mostra o corpo inteiro menor; ele CORTA o corpo. Enquadramento
     que cabe todo dentro da moldura nao e close, e retrato de corpo inteiro
     pequeno. E o mesmo principio ja registrado no CLAUDE.md para a variante
     miuda do mascote: em outro tamanho nao se reduz o desenho, redesenha-se.

     Vale notar que na arte canonica a cabeca (104 de largura) e MAIS larga que
     os ombros (88). O personagem tem cabeca grande mesmo, e isso e o estilo
     dele; o que equilibra la sao as pernas longas, que num busto nao existem.
     Por isso aqui o equilibrio precisa vir do corte. -->
<!-- A linha do ombro cai em DIAGONAL quase reta, e so as pontas arredondam.
     A versao anterior era uma quadratica unica de ponta a ponta, o que produziu
     uma colina: com o topo tao alto em relacao a largura, a silhueta virou um
     morro em vez de um par de ombros. Ombro tem quina; o moletom so a suaviza. -->
<path d="M-40 520
         L-6 456
         Q16 422 104 392
         Q200 372 296 392
         Q384 422 406 456
         L440 520 Z" fill="url(#moletom)"/>

<!-- Abertura do capuz em volta do pescoco. Chapada e bem mais escura que o
     moletom: com o gradiente `capuz`, as duas cores ficavam tao proximas que a
     gola sumia e sobrava so o cordao magenta boiando. -->
<path d="M108 386 Q200 344 292 386 Q200 418 108 386 Z" fill="#120826"/>
<path d="M108 386 Q200 344 292 386" stroke="#FF2D95" stroke-width="5.5"
      fill="none" stroke-linecap="round"/>
<path d="M108 386 Q200 344 292 386" stroke="#FF9AE4" stroke-width="1.8"
      fill="none" opacity="0.8"/>

<!-- Cordoes do capuz, saindo de DENTRO da gola, com ponteiras -->
<path d="M174 410 Q166 450 170 480" stroke="#FF2D95" stroke-width="4.5"
      fill="none" stroke-linecap="round"/>
<path d="M228 410 Q238 448 234 474" stroke="#FF2D95" stroke-width="4.5"
      fill="none" stroke-linecap="round"/>
<rect x="164" y="478" width="12" height="18" rx="3" fill="#8B92AE"/>
<rect x="229" y="472" width="12" height="18" rx="3" fill="#8B92AE"/>

<!-- Ombro direito: placas, e a divisa seguindo para baixo -->
<path d="M208 388 Q320 400 396 452 L424 520 L208 520 Z" fill="#241748" opacity="0.5"/>
<line x1="200" y1="372" x2="200" y2="520" stroke="#00E5FF" stroke-width="2.5" opacity="0.5"/>
<circle cx="326" cy="458" r="6" fill="#5C6382"/>
<circle cx="360" cy="490" r="5" fill="#5C6382"/>
<path d="M286 442 L372 470" stroke="#5C6382" stroke-width="2.2" opacity="0.7"/>

<!-- Remendo de terminal, no peito esquerdo. Centralizado ele competia com a
     costura e parecia botao de aparelho, nao remendo de moletom. -->
<g transform="rotate(-5 106 472)">
  <rect x="66" y="450" width="80" height="44" rx="6" fill="#170A31"
        stroke="#39FF14" stroke-width="2.5"/>
  <text x="80" y="482" font-family="ui-monospace, monospace" font-size="25"
        font-weight="700" fill="#39FF14">&gt;_</text>
</g>
</svg>
